name: GitHub Actions solutions CI

on:
  push:
    branches:
      - challenge01-solutions
  pull_request:
    branches:
      - challenge01-solutions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build code
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Test code
        run: go test -v ./...
